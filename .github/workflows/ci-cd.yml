name: CI/CD

#
#   pull_request            -> checks + build images (no push, no deploy)
#   push to main            -> checks + push :<sha> and :latest
#   push to staging         -> checks + push :<sha> and :staging
#   push of a desktop-v* tag-> desktop installer release
#   workflow_dispatch       -> deploy the compose stack by hand, or a desktop version
#
# Production runs on Render (backend + AI service) and Vercel (frontend); both
# deploy from GitHub on their own, so nothing here needs to reach a server. The
# SSH + docker-compose deploy job is kept for the optional self-hosted stack and
# only runs when dispatched. Its secrets are therefore optional:
#   production: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
#   staging:    STAGING_DEPLOY_HOST, STAGING_DEPLOY_USER,
#               STAGING_DEPLOY_SSH_KEY, STAGING_DEPLOY_PATH
#
# Each server keeps its own .env; nothing secret is passed through the workflow.
# Deploys pin AERIS_TAG to the deployed commit, so a rollout is reproducible and
# the previous tag is saved for rollback. GHCR packages must be readable by both
# servers (public, or a `docker login ghcr.io` already performed there).
on:
  pull_request:
  push:
    branches: [main, staging]
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy (ignored when publishing a desktop release)
        type: choice
        default: staging
        options: [staging, production]
      desktop_version:
        description: 'Publish a desktop release with this version, e.g. 1.2.0 (leave blank to skip)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Settings are read from the environment at import time; throwaway values.
      SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_SETTINGS_MODULE: config.settings.development
      ALLOWED_HOSTS: localhost,127.0.0.1
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/development.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Lint (unused imports and undefined names only)
        run: ruff check apps config --select F401,F811,F821,F841

      - name: Django system checks
        run: python manage.py check

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend (PWA)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build the PWA
        run: npm run build
        env:
          # Same-origin deployment: nginx serves /api, /ws and /ai. These are
          # placeholders so a build that references them still compiles.
          VITE_BACKEND_URL: http://localhost:8000
          VITE_WS_BACKEND_URL: ws://localhost:8000

  ai-service:
    name: AI service (FastAPI)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      # Must match ai-service/Dockerfile. requirements.production.txt pins
      # numpy 2.5.x, which requires Python >= 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.production.txt

      - name: Install dependencies (CPU torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.production.txt

      - name: Import check
        run: python -c "import app.main; print('ai-service imports cleanly')"

  # Builds all three images once per run. On pull requests this is the build
  # check (nothing is pushed); on main/staging it also pushes the tags that the
  # deploy jobs below roll out.
  images:
    name: Build image (${{ matrix.image }})
    needs: [backend, frontend, ai-service]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: frontend
            context: frontend
          - image: ai
            context: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lowercase; the repository owner may not be.
      # main publishes :latest, staging publishes :staging, so the two
      # environments never share a moving tag. Every push also gets an
      # immutable :<sha> tag, which is what the deploy jobs pin.
      - name: Resolve tags
        id: tags
        if: github.event_name != 'pull_request'
        run: |
          prefix="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          channel=latest
          if [ "$GITHUB_REF" = "refs/heads/staging" ]; then channel=staging; fi
          {
            echo "list<<EOF"
            echo "${prefix}-${{ matrix.image }}:${GITHUB_SHA}"
            echo "${prefix}-${{ matrix.image }}:${channel}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # One deploy job, parameterised per environment instead of two near-identical
  # jobs. Secrets are read by prefix, so production keeps its existing names.
  deploy:
    name: Deploy ${{ matrix.environment }}
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            branch: staging
            secret_prefix: STAGING_
          - environment: production
            branch: main
            secret_prefix: ''
    # Deploys are manual: Render and Vercel ship from GitHub themselves, so a
    # push must not try to SSH anywhere (it would fail without the optional
    # DEPLOY_* secrets). Dispatch this workflow and pick an environment to roll
    # out the self-hosted compose stack instead.
    #
    # The `matrix` context is not available in a job-level `if:`, so this guard
    # only uses github/inputs. The per-environment selection happens on the
    # step below, where matrix IS available.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.desktop_version == ''
    steps:
      # appleboy/ssh-action only reports "missing server host" for an empty
      # host and fails the step without naming the other missing values, so
      # check them up front and fail with an explicit list instead.
      - name: Preflight deploy secrets
        if: >-
          (github.event_name == 'push' && github.ref == format('refs/heads/{0}', matrix.branch)) ||
          (github.event_name == 'workflow_dispatch' && inputs.target == matrix.environment)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets[format('{0}DEPLOY_HOST', matrix.secret_prefix)] }}
          DEPLOY_USER: ${{ secrets[format('{0}DEPLOY_USER', matrix.secret_prefix)] }}
          DEPLOY_SSH_KEY: ${{ secrets[format('{0}DEPLOY_SSH_KEY', matrix.secret_prefix)] }}
          DEPLOY_PATH: ${{ secrets[format('{0}DEPLOY_PATH', matrix.secret_prefix)] }}
        run: |
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              missing+=("${{ matrix.secret_prefix }}${name}")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing deploy secrets for environment '${{ matrix.environment }}': ${missing[*]}"
            echo "" >&2
            echo "These are empty for environment '${{ matrix.environment }}':" >&2
            for name in "${missing[@]}"; do
              echo "  - $name" >&2
            done
            echo "" >&2
            echo "Add them under Settings -> Environments -> ${{ matrix.environment }}" >&2
            echo "(or as repository secrets) and re-run this job." >&2
            exit 1
          fi

          echo "All four deploy secrets are set for environment '${{ matrix.environment }}'."

      - name: Pull the new tag and restart
        if: >-
          (github.event_name == 'push' && github.ref == format('refs/heads/{0}', matrix.branch)) ||
          (github.event_name == 'workflow_dispatch' && inputs.target == matrix.environment)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[format('{0}DEPLOY_HOST', matrix.secret_prefix)] }}
          username: ${{ secrets[format('{0}DEPLOY_USER', matrix.secret_prefix)] }}
          key: ${{ secrets[format('{0}DEPLOY_SSH_KEY', matrix.secret_prefix)] }}
          envs: TAG
          script: |
            set -euo pipefail
            cd "${{ secrets[format('{0}DEPLOY_PATH', matrix.secret_prefix)] }}"

            # Rewrite only the AERIS_TAG line so the rest of the server .env
            # (secrets, hosts, origins) stays untouched.
            set_tag() {
              if grep -qE '^AERIS_TAG=' .env; then
                sed -i "s|^AERIS_TAG=.*|AERIS_TAG=$1|" .env
              else
                printf 'AERIS_TAG=%s\n' "$1" >> .env
              fi
            }

            # Keep the last working tag so a failed rollout can be undone.
            previous=$(grep -E '^AERIS_TAG=' .env | head -n1 | cut -d= -f2 || true)
            printf 'AERIS_TAG=%s\n' "${previous:-latest}" > .aeris-previous-tag

            set_tag "$TAG"
            echo "Rolling out AERIS_TAG=$TAG"

            docker compose pull
            docker compose up -d --remove-orphans

            # The stack is considered live only once the API answers.
            for attempt in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health/ || true)
              if [ "$code" = "200" ]; then
                echo "Deployed AERIS_TAG=$TAG"
                exit 0
              fi
              sleep 5
            done

            echo "Health check failed; restoring previous tag" >&2
            docker compose logs --tail=100 backend >&2 || true
            set_tag "$(cut -d= -f2 .aeris-previous-tag)"
            docker compose pull
            docker compose up -d --remove-orphans
            exit 1
        env:
          TAG: ${{ github.sha }}

  # Independent of the server deploys: the desktop shell only ships when a
  # desktop-v* tag is pushed (or a version is supplied on dispatch).
  desktop-release:
    name: Desktop release
    if: >-
      startsWith(github.ref, 'refs/tags/desktop-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.desktop_version != '')
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The AI sidecar is frozen into the installer, so the runner needs the
      # same interpreter the AI service image uses (numpy 2.5.x needs 3.12).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.production.txt

      - name: Prepare the AI sidecar toolchain
        working-directory: .
        shell: pwsh
        run: |
          python -m venv ai-service\.venv
          $py = "ai-service\.venv\Scripts\python.exe"
          & $py -m pip install --upgrade pip
          & $py -m pip install --extra-index-url https://download.pytorch.org/whl/cpu `
            -r ai-service\requirements.production.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "Installing AI service requirements failed" }

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.desktop_version }}'
          } else {
            '${{ github.ref_name }}' -replace '^desktop-v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must look like 1.2.3 (got '$version'). Tag as desktop-v1.2.3."
          }

          # Keep package.json as the single source of truth for app.getVersion().
          npm version $version --no-git-tag-version --allow-same-version
          Add-Content -Path $env:GITHUB_ENV -Value "AERIS_VERSION=$version"

      - name: Install dependencies
        run: npm ci

      # Bundled build: scripts/build-desktop.ps1 builds the SPA, freezes the AI
      # service with PyInstaller, stages it into ai-bundle for extraResources,
      # then packages and publishes. The window loads the local sidecar origin
      # (SPA + /ai), while API/WebSocket calls go to the deployed backend — that
      # is why cameras can be reached over RTSP from the operator's machine.
      - name: Build and publish installers
        working-directory: .
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't fail looking for a certificate on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Code signing. Set these two repository secrets and every build is
          # signed, which is what removes "Unknown publisher" / the SmartScreen
          # block: WINDOWS_CERT_PFX_BASE64 is the base64 of a .pfx and
          # WINDOWS_CERT_PASSWORD its password. Left unset, the build stays
          # unsigned and Windows keeps warning.
          CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # Shared secrets for the bundled sidecar; omit and the script falls
          # back to its defaults, which the backend must then accept.
          AI_SERVICE_API_KEY: ${{ secrets.AI_SERVICE_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          ./scripts/build-desktop.ps1 -IncludeAi -Publish `
            -ServerUrl http://localhost:8005 `
            -BackendUrl https://project-aeris.onrender.com

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeris-desktop-${{ env.AERIS_VERSION }}
          path: |
            frontend/release/*.exe
            frontend/release/*.yml
            frontend/release/*.blockmap
          if-no-files-found: warn
          retention-days: 14
