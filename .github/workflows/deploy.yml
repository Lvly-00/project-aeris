name: Deploy

# Builds the three images, pushes them to GitHub Container Registry, then asks
# the server to pull the new tag and restart the stack.
#
# Required repository secrets:
#   DEPLOY_HOST      hostname or IP of the server
#   DEPLOY_USER      ssh user that owns /srv/aeris on the server
#   DEPLOY_SSH_KEY   private key for that user
#   DEPLOY_PATH      path to the checkout on the server (e.g. /srv/aeris)
#
# The server keeps its own .env; nothing secret is passed through this workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push images
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lowercase; the repository owner may not be.
      - name: Resolve image prefix
        id: image
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-backend:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-frontend:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push AI service
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-ai:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}-ai:latest
          cache-from: type=gha,scope=ai

  deploy:
    name: Roll out to the server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull the new tag and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Keep the last working tag so a failed rollout can be undone with
            # the same command and the previous value of AERIS_TAG.
            echo "AERIS_TAG=$(grep -E '^AERIS_TAG=' .env | cut -d= -f2)" > .aeris-previous-tag

            docker compose pull
            docker compose up -d --remove-orphans

            # The stack is considered live only once the API answers.
            for attempt in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health/ || true)
              if [ "$code" = "200" ]; then
                echo "Deployed $(grep -E '^AERIS_TAG=' .env)"
                exit 0
              fi
              sleep 5
            done

            echo "Health check failed; restoring previous tag" >&2
            docker compose logs --tail=100 backend >&2 || true
            cat .aeris-previous-tag >> .env
            docker compose up -d --remove-orphans
            exit 1
