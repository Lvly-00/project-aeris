upstream backend {
    server backend:8000;
}

upstream ai-service {
    server ai-service:8005;
}

upstream frontend {
    server frontend:80;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                        always;
    add_header X-Frame-Options           "DENY"                                           always;
    add_header X-XSS-Protection          "1; mode=block"                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;

    # ── /internal/ — service-to-service only (brief §5.4) ──────────────────
    #
    # Layer 1 (this block): network-level restriction.
    #   - Docker Compose creates a default bridge network in 172.16.0.0/12.
    #     Only containers on that network (the AI service) can reach this path.
    #   - All other sources — including the public internet, the frontend
    #     container, and browser requests — are rejected with 403 before Django
    #     ever sees the request.
    #   - If you change the Docker network subnet, update the `allow` lines.
    #
    # Layer 2 (Django): InternalAPIKeyPermission still checks X-Internal-Key,
    #   so a misconfigured allow rule or a rogue container on the same network
    #   is still rejected at the application layer.
    #
    location /internal/ {
        # Docker Compose default bridge subnets
        allow 172.16.0.0/12;   # covers 172.16–172.31 (default Docker range)
        allow 192.168.0.0/16;  # cover custom Compose networks on 192.168.x.x
        allow 10.0.0.0/8;      # cover custom Compose networks on 10.x.x.x
        deny  all;

        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Frontend SPA
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket (Django Channels)
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # Media files (evidence images, snapshots)
    location /media/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI Service proxy
    location /ai/ {
        rewrite ^/ai/(.*) /$1 break;
        proxy_pass http://ai-service;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Django static files
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
