<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AERIS — Offline</title>

  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1b1e"  media="(prefers-color-scheme: dark)" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #ffffff;
      --bg-icon:     #f1f3f5;
      --title:       #1a1b1e;
      --body:        #868e96;
      --accent:      #fd7e14;
      --success:     #2f9e44;
      --btn-bg:      rgba(253,126,20,.12);
      --btn-text:    #fd7e14;
      --bar-bg:      #dee2e6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:          #141517;
        --bg-icon:     #25262b;
        --title:       #c1c2c5;
        --body:        #909296;
        --success:     #69db7c;
        --btn-bg:      rgba(253,126,20,.14);
        --bar-bg:      #2c2e33;
      }
    }

    html, body {
      height: 100%;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--title);
      padding-top:    env(safe-area-inset-top);
      padding-right:  env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left:   env(safe-area-inset-left);
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px 24px 80px;
      text-align: center;
    }

    /* ── Icon circle ───────────────────────────────────────────────── */
    .icon-wrap {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: var(--bg-icon);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .icon-wrap.pulsing { animation: pulse 2.4s ease-in-out infinite; }
    .icon-wrap svg { display: block; }

    @keyframes pulse {
      0%, 100% { opacity: 1;    transform: scale(1);    }
      50%       { opacity: 0.65; transform: scale(0.95); }
    }

    /* ── Text ──────────────────────────────────────────────────────── */
    .content { max-width: 440px; }

    h1 {
      font-size: 1.5rem; font-weight: 700; line-height: 1.3;
      margin-bottom: 8px; color: var(--title);
    }
    h1.success { color: var(--success); }

    p { font-size: 0.875rem; line-height: 1.6; color: var(--body); }

    /* ── Button ────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 24px; border: none; border-radius: 8px;
      background: var(--btn-bg); color: var(--btn-text);
      font-size: 0.9375rem; font-weight: 600; font-family: inherit;
      cursor: pointer; min-width: 160px; justify-content: center;
      transition: opacity .15s;
    }
    .btn:hover  { opacity: .8; }
    .btn:active { opacity: .6; }

    /* ── State sections ────────────────────────────────────────────── */
    .state { display: none; flex-direction: column; align-items: center; gap: 24px; }
    .state.active { display: flex; }

    /* ── Progress bar ──────────────────────────────────────────────── */
    .progress-track {
      width: 200px; height: 3px; border-radius: 2px;
      background: var(--bar-bg); overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 2px;
      background: var(--success);
      animation: progress 1600ms linear forwards;
    }
    @keyframes progress { from { width: 0; } to { width: 100%; } }

    /* ── Dots spinner (matches Mantine Loader type="dots") ─────────── */
    .dots {
      display: flex; align-items: center; gap: 6px;
      height: 20px;
    }
    .dots span {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: dot-bounce 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(1) { animation-delay: 0s;    }
    .dots span:nth-child(2) { animation-delay: 0.2s;  }
    .dots span:nth-child(3) { animation-delay: 0.4s;  }

    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1.0); opacity: 1;   }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- Phase 1: offline ───────────────────────────────────────────── -->
    <div class="state active" id="stateOffline">
      <div class="icon-wrap pulsing">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"
             fill="none" stroke="var(--accent)" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <circle cx="12" cy="20" r="1" fill="var(--accent)" stroke="none"/>
        </svg>
      </div>
      <div class="content">
        <h1>You are currently offline.</h1>
        <p>Check your network connection. AERIS will reconnect automatically once you're back online.</p>
      </div>
      <button class="btn" onclick="location.reload()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Refresh
      </button>
    </div>

    <!-- Phase 2: justBack ──────────────────────────────────────────── -->
    <div class="state" id="stateJustBack">
      <div class="icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"
             fill="none" stroke="var(--success)" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <circle cx="12" cy="20" r="1" fill="var(--success)" stroke="none"/>
        </svg>
      </div>
      <div class="content">
        <h1 class="success">You're back online!</h1>
        <p>Connection restored.</p>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Phase 3: reconnecting ──────────────────────────────────────── -->
    <div class="state" id="stateReconnecting">
      <div class="icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"
             fill="none" stroke="var(--success)" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <circle cx="12" cy="20" r="1" fill="var(--success)" stroke="none"/>
        </svg>
      </div>
      <div class="content">
        <h1>Reconnecting…</h1>
        <p>Re-establishing connection. This page will reload shortly.</p>
      </div>
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
    </div>

  </div>

  <script>
    const BACK_ONLINE_MSG  = 1600;
    const RECONNECT_WAIT   = 1400;

    function show(id) {
      ['stateOffline','stateJustBack','stateReconnecting'].forEach(s => {
        document.getElementById(s).classList.remove('active');
      });
      document.getElementById(id).classList.add('active');
    }

    function restartProgressBar() {
      const fill  = document.getElementById('progressFill');
      const clone = fill.cloneNode(true);
      fill.parentNode.replaceChild(clone, fill);
    }

    function runRecovery() {
      // Phase 2 — justBack
      show('stateJustBack');
      restartProgressBar();

      setTimeout(() => {
        // Phase 3 — reconnecting
        show('stateReconnecting');

        setTimeout(() => {
          location.reload();
        }, RECONNECT_WAIT);

      }, BACK_ONLINE_MSG);
    }

    if (navigator.onLine) {
      runRecovery();
    } else {
      window.addEventListener('online', runRecovery, { once: true });
    }
  </script>
</body>
</html>
