appId: com.aeris.cctv
productName: Aeris
copyright: Copyright © 2026

# Auto-update feed. Releases in this public repo are readable without
# credentials, so the installed app polls them directly and holds no token.
# Publishing (CI only) is authenticated with GH_TOKEN at build time.
publish:
  provider: github
  owner: Lvly-00
  repo: project-aeris
  releaseType: release

# The bundled AI sidecar (~1.3 GB of torch/opencv/numpy) exceeds 7-Zip's
# memory budget at the default "maximum" (-mx=9) compression level.
# "normal" (-mx=7) compresses almost as well for a fraction of the RAM.
compression: normal

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - package.json

# No electronDist: pointing it at node_modules/electron/dist fails on CI
# runners that skip the electron postinstall download ("The specified
# electronDist does not exist"). Left unset, electron-builder fetches the
# Electron distribution for the pinned version into its own cache.

# Bundled deployment: the desktop app loads the local ai-service origin
# (SPA + /ai). When scripts\build-desktop.ps1 is run with -IncludeAi, the
# PyInstaller-built sidecar is staged into ai-bundle\ and shipped here as
# resources\ai-service, where electron/main.cjs auto-launches it. Without it,
# the committed ai-bundle\README.txt keeps the directory present and the app
# expects the AI service to be started separately.
extraResources:
  - from: ai-bundle
    to: ai-service
    filter: ["**/*"]

# Thin client: the backend, database and AI service run on the deployed
# server — nothing Python-related is packaged with the desktop app.
# The server address is resolved at runtime (AERIS_SERVER_URL env var or
# server-url.txt in the user data folder; default http://localhost:8000).

win:
  # Without this, Windows uses Electron's default (blue) app icon for the exe,
  # the Start-menu/desktop shortcut and the taskbar. Both files are tracked
  # (build/ is gitignored, so the icon cannot live there): icon.ico holds the
  # 16-256px sizes Windows asks for, icon.png is the 512px AERIS logo used for
  # the window/taskbar icon in main.cjs.
  icon: electron/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerSidebar: null

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
  icon: build/

extraMetadata:
  main: electron/main.cjs
