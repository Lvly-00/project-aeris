appId: com.aeris.cctv
productName: Aeris
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - package.json

electronDist: node_modules/electron/dist

# Thin client: the backend, database and AI service run on the deployed
# server — nothing Python-related is packaged with the desktop app.
# The server address is resolved at runtime (AERIS_SERVER_URL env var or
# server-url.txt in the user data folder; default http://localhost:8000).

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerSidebar: null

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
  icon: build/

extraMetadata:
  main: electron/main.cjs
