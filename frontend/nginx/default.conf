# Bundle ingress — serves the SPA and proxies /ai/* to the bundled AI service
# on one origin so the frontend's relative "/ai" calls are same-origin.
#
# Templated: nginx:alpine's entrypoint substitutes ${AI_SERVICE_API_KEY} from
# the container env (see frontend/Dockerfile — config is copied to
# /etc/nginx/templates/). $uri/$host are preserved because only defined env
# vars are substituted.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for any non-file route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # AI service — bundle glue. /ai/cameras/4/frame  →  /cameras/4/frame on
    # the AI service listening at 127.0.0.1:8005 inside this container.
    # If the AI runs on a separate host instead, change the proxy_pass target.
    location /ai/ {
        rewrite ^/ai/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-side key, mirroring the Django /ai proxy (config/urls/main.py):
        # the browser's placeholder key must never reach the AI service.
        proxy_set_header X-API-Key          ${AI_SERVICE_API_KEY};
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}