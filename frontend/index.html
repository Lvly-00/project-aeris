<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Project AERIS</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Standard favicon -->
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />

  <!-- Theme colour (Android Chrome + Safari tab bar) — neutral, matching
       the app shell instead of the brand orange. -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1b1e" media="(prefers-color-scheme: dark)" />

  <!-- ── iOS PWA ─────────────────────────────────────────────────────────── -->
  <!-- Enable full-screen standalone mode when added to the home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- Status bar: "default" = white bar with dark text -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <!-- Name shown below the home screen icon -->
  <meta name="apple-mobile-web-app-title" content="AERIS" />

  <!-- Home screen icons — iOS picks the closest size -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png" />

  <!-- iOS splash screens (apple-touch-startup-image)
       Each entry targets one physical resolution via media query.
       Landscape variants are included for iPads. -->

  <!-- iPhone 14 Pro Max (1290×2796 @3x → 430×932 pt) -->
  <link rel="apple-touch-startup-image"
        media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
        href="/splash/splash-1290x2796.png" />

  <!-- iPhone 14 Pro (1179×2556 @3x → 393×852 pt) -->
  <link rel="apple-touch-startup-image"
        media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
        href="/splash/splash-1179x2556.png" />

  <!-- iPhone 14 Plus / 13 Pro Max / 12 Pro Max (1284×2778 @3x → 428×926 pt) -->
  <link rel="apple-touch-startup-image"
        media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
        href="/splash/splash-1284x2778.png" />

  <!-- iPhone 14 / 13 / 13 Pro / 12 / 12 Pro (1170×2532 @3x → 390×844 pt) -->
  <link rel="apple-touch-startup-image"
        media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
        href="/splash/splash-1170x2532.png" />

  <!-- iPhone XR / 11 (828×1792 @2x → 414×896 pt) -->
  <link rel="apple-touch-startup-image"
        media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
        href="/splash/splash-828x1792.png" />

  <!-- iPhone 8 / SE 2nd+3rd gen (750×1334 @2x → 375×667 pt) -->
  <link rel="apple-touch-startup-image"
        media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
        href="/splash/splash-750x1334.png" />

  <!-- iPhone SE 1st gen (640×1136 @2x → 320×568 pt) -->
  <link rel="apple-touch-startup-image"
        media="screen and (device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
        href="/splash/splash-640x1136.png" />

  <!-- iPad Pro 12.9" (2048×2732 @2x → 1024×1366 pt) -->
  <link rel="apple-touch-startup-image"
        media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
        href="/splash/splash-2048x2732.png" />
  <link rel="apple-touch-startup-image"
        media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
        href="/splash/splash-2048x2732.png" />

  <!-- iPad Pro 11" / Air 10.9" (1668×2388 @2x → 834×1194 pt) -->
  <link rel="apple-touch-startup-image"
        media="screen and (device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
        href="/splash/splash-1668x2388.png" />
  <link rel="apple-touch-startup-image"
        media="screen and (device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
        href="/splash/splash-1668x2388.png" />

  <!-- iPad Air / iPad (1668×2224 @2x → 834×1112 pt) -->
  <link rel="apple-touch-startup-image"
        media="screen and (device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
        href="/splash/splash-1668x2224.png" />

  <!-- iPad 9.7" / Air 1-2 (1536×2048 @2x → 768×1024 pt) -->
  <link rel="apple-touch-startup-image"
        media="screen and (device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
        href="/splash/splash-1536x2048.png" />
  <link rel="apple-touch-startup-image"
        media="screen and (device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
        href="/splash/splash-1536x2048.png" />

  <!-- Android Chrome PWA -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Leaflet CSS — pinned version with Subresource Integrity -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
        crossorigin="anonymous" />

  <style>
    /* Safe-area insets for iPhone notch / Dynamic Island / home bar.
       Mantine's body has no padding by default; this ensures content
       never sits under hardware UI elements when running as a PWA. */
    body {
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
