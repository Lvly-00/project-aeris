# Production stack.
#
#   cp .env.example .env        # fill in real secrets first
#   docker compose pull && docker compose up -d
#
# All traffic enters through nginx on 80/443. The database, Redis and the AI
# service are reachable only from the compose network; the backend is bound to
# loopback so the deploy script's health check can reach it without exposing
# the API on a second port.
#
# Local development uses docker-compose.dev.yml on top of this file.
version: '3.8'

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DB_HOST: db
  DB_PORT: "3306"
  USE_MYSQL: "True"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${AERIS_IMAGE_PREFIX:-ghcr.io/lvly-00/project-aeris}-backend:${AERIS_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
      BACKEND_API_URL: http://backend:8000/api
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    ports:
      # Loopback only: nginx is the public entry point, this exists for the
      # deploy health check and for server-side debugging.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Daphne (ASGI) is required: gunicorn speaks WSGI and cannot serve /ws/.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_lookups &&
             python manage.py seed_default_admin &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  celery:
    image: ${AERIS_IMAGE_PREFIX:-ghcr.io/lvly-00/project-aeris}-backend:${AERIS_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    volumes:
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info --concurrency 2

  ai-service:
    image: ${AERIS_IMAGE_PREFIX:-ghcr.io/lvly-00/project-aeris}-ai:${AERIS_TAG:-latest}
    build: ./ai-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_API_URL: http://backend:8000/api
      DEVICE: ${DEVICE:-cpu}
    volumes:
      - ai_data:/app/data
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    image: ${AERIS_IMAGE_PREFIX:-ghcr.io/lvly-00/project-aeris}-frontend:${AERIS_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
      - ai-service

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/server.crt:/etc/ssl/certs/server.crt:ro
      - ./ssl/server.key:/etc/ssl/private/server.key:ro
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - ai-service
      - frontend

volumes:
  mysql_data:
  redis_data:
  backend_media:
  backend_static:
  ai_data:
